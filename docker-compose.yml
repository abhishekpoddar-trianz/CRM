version: '3.8'

services:
  crm-app:
    build: .
    image: crm:latest
    container_name: crm-app
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=${DB_HOST:-db.example.com}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-crm}
      - DB_USERNAME=${DB_USERNAME:-crmuser}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
      - TZ=UTC
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/appinfo/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  app-network:
    driver: bridge

volumes:
  logs:
  config: