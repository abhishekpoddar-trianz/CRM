version: '3.8'

services:
  crm-app:
    build: .
    image: crm-app:latest
    container_name: crm-application
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - SPRING_PROFILES_ACTIVE=docker
      - DATABASE_URL=jdbc:mysql://mysql-db:3306/crm?useSSL=false
      - DB_USERNAME=root
      - DB_PASSWORD=password
      - TZ=UTC
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - crm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/appinfo/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  crm-network:
    driver: bridge

volumes:
  logs:
  config: