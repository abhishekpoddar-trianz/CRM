version: '3.8'

services:
  crm-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: crm-app:latest
    container_name: crm-application
    ports:
      - "8080:8080"
    environment:
      # Spring Profile
      - SPRING_PROFILES_ACTIVE=docker
      
      # JVM Options
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      
      # Database Configuration (External MySQL)
      - DB_HOST=${DB_HOST:-mysql-server}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-crm}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      
      # Hibernate Configuration
      - DDL_AUTO=${DDL_AUTO:-validate}
      
      # Application Settings
      - SERVER_PORT=8080
      - MANAGEMENT_CONTEXT_PATH=/appinfo
    volumes:
      # Application logs
      - ./logs:/app/logs
      
      # External configuration (optional)
      - ./config:/app/config:ro
    networks:
      - crm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q --spider http://localhost:8080/appinfo/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

networks:
  crm-network:
    driver: bridge

volumes:
  logs:
  config: