# Cloud-specific configuration profile
# This profile is activated in containerized environments

# Database Configuration for Cloud (RDS)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Enhanced Connection Pooling for Cloud
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# Security Configuration for Cloud
management.security.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Thymeleaf Configuration for Production
spring.thymeleaf.cache=true
spring.thymeleaf.mode=HTML

# Cloud Data Source
app.data.source=s3

# Logging Configuration for Cloud (JSON structured)
logging.level.root=WARN
logging.level.crm=INFO
logging.level.software.amazon.awssdk=WARN

# Cloud Monitoring
management.metrics.export.cloudwatch.enabled=true
management.metrics.export.cloudwatch.step=1m

# Server Configuration
server.compression.enabled=true
server.http2.enabled=true