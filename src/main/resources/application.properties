# Cloud-ready database configuration using environment variables
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/crm?useSSL=false&requireSSL=true&verifyServerCertificate=false}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password}

# Connection pool configuration for cloud environments
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1200000}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}

# Cloud security configuration - enable security management
management.security.enabled=${MANAGEMENT_SECURITY_ENABLED:true}
management.context-path=${MANAGEMENT_CONTEXT_PATH:/appinfo}

# AWS-specific configurations
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:crm-files}

# Application configuration
app.upload.dir=${APP_UPLOAD_DIR:classpath:data/}

# Thymeleaf configuration
spring.thymeleaf.mode=HTML5
spring.thymeleaf.cache=${THYMELEAF_CACHE_ENABLED:false}

# Logging configuration for cloud environments
logging.level.crm=${LOG_LEVEL_CRM:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:WARN}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
