# Database Configuration - Cloud Native
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.datasource.url=${DATABASE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:crm}?useSSL=true&requireSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pooling Configuration
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:300000}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1200000}
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION:60000}

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

# Security Configuration
management.security.enabled=${MANAGEMENT_SECURITY_ENABLED:true}
management.context-path=${MANAGEMENT_CONTEXT_PATH:/actuator}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,info,metrics}

# Thymeleaf Configuration - Cloud Compatible
spring.thymeleaf.mode=${THYMELEAF_MODE:HTML}
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
spring.thymeleaf.encoding=${THYMELEAF_ENCODING:UTF-8}

# AWS S3 Configuration
aws.s3.bucket.name=${S3_BUCKET_NAME:crm-data-storage}
aws.s3.region=${AWS_REGION:us-east-1}

# Application Configuration
app.data.source=${DATA_SOURCE:classpath}
logging.level.crm=${LOG_LEVEL:INFO}

# Cloud Monitoring and Observability
logging.pattern.console=%d{ISO8601} [%thread] %-5level %logger{36} [%X{correlationId:-}] - %msg%n
logging.pattern.file=%d{ISO8601} [%thread] %-5level %logger{36} [%X{correlationId:-}] - %msg%n

# Server Configuration
server.port=${PORT:8080}
server.compression.enabled=true
server.http2.enabled=true

# CSV Export Configuration
app.csv.max-records=${CSV_MAX_RECORDS:10000}
app.csv.page-size=${CSV_PAGE_SIZE:1000}

# Health Check Configuration
management.health.defaults.enabled=true
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:when-authorized}
management.health.db.enabled=true
management.health.diskspace.enabled=true

# Actuator Configuration for Cloud Monitoring
management.endpoints.web.base-path=/actuator
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Micrometer Configuration for CloudWatch
management.metrics.export.cloudwatch.namespace=CRM-Application
management.metrics.export.cloudwatch.enabled=${CLOUDWATCH_METRICS_ENABLED:false}
management.metrics.export.cloudwatch.step=1m
management.metrics.distribution.percentiles-histogram.http.server.requests=true
